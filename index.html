<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LinkGuard — Blockchain Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070d;
    --bg-2:#080c16;
    --panel:rgba(12,18,32,0.62);
    --panel-solid:#0b1120;
    --panel-border:rgba(120,160,220,0.14);
    --panel-border-strong:rgba(120,190,255,0.28);
    --cyan:#3ee6ff;
    --cyan-dim:#1c8fa8;
    --purple:#9b6bff;
    --green:#3ee69a;
    --amber:#ffb547;
    --red:#ff5470;
    --text:#e7edf7;
    --text-dim:#93a1b8;
    --text-faint:#5b6883;
    --font-display:"Space Grotesk", "Segoe UI", sans-serif;
    --font-body:"Inter", "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", "SFMono-Regular", monospace;
  }
  :root:not([data-theme="light"]){
    --bg:#05070d; --bg-2:#080c16; --panel:rgba(12,18,32,0.62); --text:#e7edf7; --text-dim:#93a1b8;
  }
  :root[data-theme="dark"]{
    --bg:#05070d; --bg-2:#080c16; --panel:rgba(12,18,32,0.62); --text:#e7edf7; --text-dim:#93a1b8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#05070d; --bg-2:#080c16; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font-body);color:var(--text);}
  #app{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 0%, #0d1730 0%, var(--bg) 55%);}
  #scene-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;}

  /* ---------- shared glass panel ---------- */
  .glass{
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:14px;
    box-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  ::selection{background:rgba(62,230,255,0.3);}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(120,160,220,0.3);border-radius:4px;}

  /* ---------- header ---------- */
  #header{
    position:absolute;top:0;left:0;right:0;height:60px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;z-index:30;
    border-bottom:1px solid var(--panel-border);
    background:linear-gradient(180deg, rgba(5,8,15,0.85), rgba(5,8,15,0.35));
    backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg, var(--cyan), var(--purple));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 22px rgba(62,230,255,0.35);
    flex-shrink:0;
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand-name{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:0.2px;}
  .brand-sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
  .badge{
    display:flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:100px;
    background:rgba(255,181,71,0.08);
    border:1px solid rgba(255,181,71,0.35);
    font-size:11.5px;color:#ffcf8a;font-weight:500;letter-spacing:0.3px;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse-dot 2s infinite;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.35;}}
  #header-right{display:flex;align-items:center;gap:14px;}
  .clock{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}

  /* ---------- left nav ---------- */
  #nav{
    position:absolute;left:16px;top:78px;bottom:16px;width:64px;z-index:25;
    display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;
  }
  .nav-btn{
    width:42px;height:42px;border-radius:11px;border:1px solid transparent;
    background:transparent;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
    position:relative;
  }
  .nav-btn svg{width:19px;height:19px;}
  .nav-btn:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .nav-btn.active{background:rgba(62,230,255,0.1);color:var(--cyan);border-color:rgba(62,230,255,0.35);}
  .nav-btn .tip{
    position:absolute;left:52px;top:50%;transform:translateY(-50%);
    background:#0d1424;border:1px solid var(--panel-border);padding:5px 10px;border-radius:7px;
    font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease;
    font-family:var(--font-body);
  }
  .nav-btn:hover .tip{opacity:1;}
  .nav-divider{width:26px;height:1px;background:var(--panel-border);margin:4px 0;}

  /* ---------- stats bar ---------- */
  #stats-bar{
    position:absolute;top:78px;left:96px;right:16px;z-index:20;
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .stat-chip{
    padding:10px 16px;min-width:104px;
  }
  .stat-label{font-size:10px;color:var(--text-faint);letter-spacing:0.6px;text-transform:uppercase;font-weight:500;}
  .stat-value{font-family:var(--font-display);font-size:19px;font-weight:600;margin-top:2px;display:flex;align-items:baseline;gap:5px;}
  .stat-value.green{color:var(--green);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}
  .stat-value .unit{font-size:11px;color:var(--text-dim);font-weight:400;}

  /* ---------- right detail panel ---------- */
  #detail-panel{
    position:absolute;top:78px;right:16px;bottom:88px;width:340px;z-index:22;
    padding:0;display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(380px);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1), opacity .32s ease;
    pointer-events:none;
  }
  #detail-panel.open{transform:translateX(0);opacity:1;pointer-events:auto;}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--panel-border);display:flex;align-items:center;justify-content:space-between;}
  .panel-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;}
  .panel-close{cursor:pointer;color:var(--text-dim);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .panel-close:hover{background:rgba(255,255,255,0.06);color:var(--text);}
  .panel-body{padding:16px 18px;overflow-y:auto;flex:1;}
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;
    font-size:11px;font-weight:600;letter-spacing:0.4px;margin-bottom:14px;
  }
  .status-pill.verified{background:rgba(62,230,154,0.1);color:var(--green);border:1px solid rgba(62,230,154,0.35);}
  .status-pill.tampered{background:rgba(255,181,71,0.1);color:var(--amber);border:1px solid rgba(255,181,71,0.35);}
  .status-pill.invalid{background:rgba(255,84,112,0.1);color:var(--red);border:1px solid rgba(255,84,112,0.35);}
  .field-row{margin-bottom:13px;}
  .field-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;font-weight:500;}
  .field-value{font-size:13px;color:var(--text);}
  .field-value.mono{font-family:var(--font-mono);font-size:11.5px;word-break:break-all;line-height:1.55;color:var(--text-dim);background:rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;border:1px solid var(--panel-border);}
  .field-value.mono.bad{color:var(--red);border-color:rgba(255,84,112,0.3);background:rgba(255,84,112,0.06);}
  .divider-line{height:1px;background:var(--panel-border);margin:14px 0;}
  .risk-bar-track{height:5px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:6px;}
  .risk-bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}

  /* ---------- bottom control dock ---------- */
  #dock{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:24;
    display:flex;gap:8px;padding:10px;align-items:center;
  }
  .dock-btn{
    display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:10px;
    background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);
    color:var(--text);font-family:var(--font-body);font-size:12.5px;font-weight:500;
    cursor:pointer;transition:all .15s ease;white-space:nowrap;
  }
  .dock-btn svg{width:15px;height:15px;flex-shrink:0;}
  .dock-btn:hover{background:rgba(255,255,255,0.07);border-color:var(--panel-border-strong);transform:translateY(-1px);}
  .dock-btn.primary{background:linear-gradient(135deg, rgba(62,230,255,0.16), rgba(155,107,255,0.16));border-color:rgba(62,230,255,0.4);color:var(--cyan);}
  .dock-btn.primary:hover{background:linear-gradient(135deg, rgba(62,230,255,0.25), rgba(155,107,255,0.25));}
  .dock-btn.danger{color:#ffb0a8;}
  .dock-btn.danger:hover{border-color:rgba(255,84,112,0.4);}
  .dock-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
  .dock-sep{width:1px;height:24px;background:var(--panel-border);}

  /* ---------- left lower: supplier / mode panels ---------- */
  #side-panel{
    position:absolute;top:78px;left:96px;bottom:88px;width:312px;z-index:21;
    display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(-360px);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1), opacity .32s ease;
    pointer-events:none; margin-top:64px;
  }
  #side-panel.open{transform:translateX(0);opacity:1;pointer-events:auto;}
  .supplier-card{
    padding:12px 13px;border-radius:11px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,0.02);margin-bottom:8px;cursor:pointer;transition:all .15s ease;
  }
  .supplier-card:hover{border-color:var(--panel-border-strong);background:rgba(255,255,255,0.045);}
  .supplier-card.selected{border-color:var(--cyan);background:rgba(62,230,255,0.06);}
  .supplier-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .supplier-id{font-family:var(--font-mono);font-size:11.5px;color:var(--cyan);font-weight:500;}
  .supplier-name{font-size:12.5px;font-weight:600;margin-top:3px;}
  .supplier-meta{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .risk-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;letter-spacing:0.3px;}
  .risk-tag.LOW{background:rgba(62,230,154,0.12);color:var(--green);}
  .risk-tag.MEDIUM{background:rgba(255,181,71,0.12);color:var(--amber);}
  .risk-tag.HIGH{background:rgba(255,84,112,0.12);color:var(--red);}

  .verify-row{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:12.5px;color:var(--text-dim);font-family:var(--font-mono);}
  .verify-row .ico{width:15px;height:15px;flex-shrink:0;}
  .verify-row.ok{color:var(--green);}
  .verify-row.bad{color:var(--red);}
  .verify-row.pending{color:var(--text-faint);}
  .verify-final{
    margin-top:14px;padding:14px;border-radius:11px;text-align:center;font-family:var(--font-display);
    font-weight:600;font-size:13.5px;letter-spacing:0.3px;
  }
  .verify-final.ok{background:rgba(62,230,154,0.08);border:1px solid rgba(62,230,154,0.35);color:var(--green);}
  .verify-final.bad{background:rgba(255,84,112,0.08);border:1px solid rgba(255,84,112,0.35);color:var(--red);}

  /* ---------- toast ---------- */
  #toast-wrap{position:absolute;top:78px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .toast{
    padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:500;
    display:flex;align-items:center;gap:8px;
    animation:toast-in .25s ease, toast-out .25s ease 2.6s forwards;
  }
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toast-out{to{opacity:0;transform:translateY(-8px);}}

  /* ---------- tooltip ---------- */
  #block-tooltip{
    position:absolute;z-index:40;pointer-events:none;
    padding:8px 12px;border-radius:9px;font-size:11.5px;
    transform:translate(-50%,-130%);opacity:0;transition:opacity .12s ease;
    font-family:var(--font-mono);white-space:nowrap;
  }
  #block-tooltip.show{opacity:1;}

  /* ---------- presentation mode ---------- */
  #present-caption{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
    z-index:50;padding:14px 26px;border-radius:12px;text-align:center;
    opacity:0;transition:opacity .4s ease, transform .4s ease;pointer-events:none;
    max-width:640px;
  }
  #present-caption.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #present-caption .step-label{font-size:10px;color:var(--cyan);letter-spacing:0.6px;text-transform:uppercase;font-weight:600;margin-bottom:4px;}
  #present-caption .step-text{font-family:var(--font-display);font-size:15px;font-weight:500;}
  #present-exit{
    position:absolute;top:78px;right:16px;z-index:55;padding:9px 15px;
    display:none;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--text-dim);
  }
  #present-exit.show{display:flex;}
  #present-exit:hover{color:var(--text);}
  #present-vignette{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .5s ease;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);}
  #present-vignette.show{opacity:1;}

  /* ---------- welcome loader ---------- */
  #loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  .loader-ring{width:44px;height:44px;border-radius:50%;border:2px solid rgba(62,230,255,0.15);border-top-color:var(--cyan);animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loader-text{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);letter-spacing:0.5px;}

  @media (max-width:920px){
    #side-panel{width:260px;}
    #detail-panel{width:280px;}
    #stats-bar{display:none;}
    .dock-btn span{display:none;}
    .dock-btn{padding:11px 12px;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="loader"><div class="loader-ring"></div><div class="loader-text">INITIALIZING VERIFICATION LAYER…</div></div>

  <canvas id="scene-canvas"></canvas>
  <div id="present-vignette"></div>

  <!-- Header -->
  <div id="header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z" stroke="#04121a" stroke-width="1.8" fill="#04121a" fill-opacity="0.0"/><path d="M12 2L4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z" stroke="#031018" stroke-width="1.6"/><path d="M9 12l2 2 4-4.5" stroke="#031018" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name">LinkGuard <span style="color:var(--text-dim);font-weight:400;">/ Blockchain</span></div>
        <div class="brand-sub">Multi-Tier Supply Chain Risk Management</div>
      </div>
    </div>
    <div id="header-right">
      <div class="badge"><span class="dot"></span>Blockchain Verification Simulation</div>
      <div class="clock" id="clock">—</div>
    </div>
  </div>

  <!-- Left nav -->
  <div id="nav" class="glass">
    <button class="nav-btn active" data-mode="network" title="Network">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2v4M10.3 13.4L6.7 17M13.7 13.4l3.6 3.6"/></svg>
      <span class="tip">3D Blockchain Network</span>
    </button>
    <button class="nav-btn" data-mode="suppliers" title="Suppliers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="7" height="7" rx="1.4"/><rect x="14" y="10" width="7" height="7" rx="1.4"/><rect x="8.5" y="3" width="7" height="7" rx="1.4"/></svg>
      <span class="tip">Supplier Records</span>
    </button>
    <button class="nav-btn" data-mode="chain" title="Supply Chain Tiers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="9" y="10" width="6" height="5" rx="1"/><rect x="9" y="17.5" width="6" height="5" rx="1"/><path d="M12 7.5v2.5M12 15v2.5"/></svg>
      <span class="tip">Supply Chain Tiers</span>
    </button>
    <div class="nav-divider"></div>
    <button class="nav-btn" data-mode="verify" title="Verification">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3.2v5.3c0 4.6-3 7.8-7 9.1-4-1.3-7-4.5-7-9.1V6.2L12 3z"/><path d="M9 12l2 2 4-4.5"/></svg>
      <span class="tip">Verification</span>
    </button>
    <button class="nav-btn" data-mode="tamper" title="Tampering Simulation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg>
      <span class="tip">Tampering Simulation</span>
    </button>
    <div class="nav-divider"></div>
    <button class="nav-btn" id="btn-present" title="Presentation Mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="19" height="12" rx="1.6"/><path d="M9.5 21h5M12 17v4"/></svg>
      <span class="tip">Presentation Mode</span>
    </button>
  </div>

  <!-- Stats bar -->
  <div id="stats-bar">
    <div class="stat-chip glass"><div class="stat-label">Blocks</div><div class="stat-value cyan" id="stat-blocks">0</div></div>
    <div class="stat-chip glass"><div class="stat-label">Verified</div><div class="stat-value green" id="stat-verified">0</div></div>
    <div class="stat-chip glass"><div class="stat-label">Transactions</div><div class="stat-value" id="stat-tx">0</div></div>
    <div class="stat-chip glass"><div class="stat-label">Suppliers Verified</div><div class="stat-value" id="stat-suppliers">0<span class="unit">/0</span></div></div>
    <div class="stat-chip glass"><div class="stat-label">Chain Status</div><div class="stat-value green" id="stat-status">VALID</div></div>
    <div class="stat-chip glass"><div class="stat-label">Last Block</div><div class="stat-value" id="stat-last" style="font-size:12.5px;font-family:var(--font-mono);font-weight:500;">—</div></div>
  </div>

  <!-- Detail panel (block click) -->
  <div id="detail-panel" class="glass">
    <div class="panel-head">
      <div class="panel-title" id="detail-title">Block</div>
      <div class="panel-close" id="detail-close">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>
    <div class="panel-body" id="detail-body"></div>
  </div>

  <!-- Side panel (suppliers / chain tiers / verify / tamper) -->
  <div id="side-panel" class="glass">
    <div class="panel-head">
      <div class="panel-title" id="side-title">Suppliers</div>
    </div>
    <div class="panel-body" id="side-body"></div>
  </div>

  <!-- Bottom dock -->
  <div id="dock" class="glass">
    <button class="dock-btn primary" id="btn-create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span>Create Block</span>
    </button>
    <button class="dock-btn" id="btn-verify">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3.2v5.3c0 4.6-3 7.8-7 9.1-4-1.3-7-4.5-7-9.1V6.2L12 3z"/><path d="M9 12l2 2 4-4.5"/></svg>
      <span>Verify Blockchain</span>
    </button>
    <button class="dock-btn danger" id="btn-tamper">

};

function pad(n){ return n<10 ? "0"+n : ""+n; }
function nowStamp(d){
  d = d || new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function shortHash(h){ return h ? (h.slice(0,4)+"…"+h.slice(-4)).toUpperCase() : "————"; }
async function sha256(msg){
  const enc = new TextEncoder().encode(msg);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  const arr = Array.from(new Uint8Array(buf));
  return arr.map(b=>b.toString(16).padStart(2,"0")).join("");
}
function rand(min,max){ return min + Math.random()*(max-min); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function toast(msg, kind){

}

/* ============================================================
   1. SUPPLY-CHAIN / SUPPLIER DATA
   ============================================================ */
const COMPONENTS = ["Power Control Unit","Sensor Array Module","Chassis Frame Assembly","Battery Cell Pack","Circuit Interconnect","Thermal Regulator","Firmware Package","Actuator Motor"];
const COMPANIES = ["Meridian Components","Aravalli Precision Ltd","Northstar Electronics","Vantage Materials Co","Sundara Fabrication","Orbital Systems Inc","Keystone Circuits","Palisade Manufacturing"];

const SUPPLIERS = [
  { id:"SUP-001", tier:1, name:"Meridian Components", component:"Power Control Unit", risk:18, status:"LOW" },
  { id:"SUP-002", tier:1, name:"Aravalli Precision Ltd", component:"Chassis Frame Assembly", risk:34, status:"LOW" },
  { id:"SUP-003", tier:2, name:"Northstar Electronics", component:"Sensor Array Module", risk:52, status:"MEDIUM" },
  { id:"SUP-004", tier:2, name:"Vantage Materials Co", component:"Battery Cell Pack", risk:71, status:"HIGH" },
  { id:"SUP-005", tier:3, name:"Sundara Fabrication", component:"Thermal Regulator", risk:29, status:"LOW" },
  { id:"SUP-006", tier:3, name:"Orbital Systems Inc", component:"Firmware Package", risk:61, status:"MEDIUM" },
];
let supplierCounter = SUPPLIERS.length;

function riskStatus(score){ return score>=65?"HIGH":score>=40?"MEDIUM":"LOW"; }

/* ============================================================
   2. BLOCKCHAIN MODEL
   ============================================================ */
class Blockchain{
  constructor(){ this.chain = []; this.txCounter = 78200; }

  async computeHash(block){
    const payload = JSON.stringify({
      index:block.index, timestamp:block.timestamp, supplierId:block.supplierId,
      transactionId:block.transactionId, data:block.data, previousHash:block.previousHash
    });
    return sha256(payload);
  }

  async addBlock(supplier){
    this.txCounter++;
    const prev = this.chain[this.chain.length-1];
    const block = {
      index: this.chain.length + 1,
      timestamp: nowStamp(),
      supplierId: supplier.id,
      transactionId: "TRX-" + this.txCounter,
      data: { component: supplier.component, riskScore: supplier.risk, status: supplier.status },
      previousHash: prev ? prev.hash : "0".repeat(64),
      verified: true, tampered:false, originalData:null
    };
    block.hash = await this.computeHash(block);
    this.chain.push(block);
    return block;
  }

  async tamperBlock(index, newFields){
    const block = this.chain.find(b=>b.index===index);
    if(!block) return null;
    block.originalData = JSON.parse(JSON.stringify(block.data));
    block.data = Object.assign({}, block.data, newFields);
    block.tampered = true;
    // hash is intentionally NOT recomputed -> mismatch will be detected on verify
    return block;
  }

  restoreBlock(index){
    const block = this.chain.find(b=>b.index===index);
    if(!block || !block.tampered) return null;
    block.data = block.originalData;
    block.originalData = null;
    block.tampered = false;
    return block;
  }

  async verify(){
    const results = [];
    let brokenFrom = null;
    for(let i=0;i<this.chain.length;i++){
      const block = this.chain[i];
      const recomputed = await this.computeHash(block);
      const hashValid = recomputed === block.hash;
      const prevValid = i===0 ? block.previousHash === "0".repeat(64) : block.previousHash === this.chain[i-1].hash;
      let status = "ok";
      if(brokenFrom !== null){ status = "invalid"; }
      else if(!hashValid){ status = "tampered"; brokenFrom = i; }
      else if(!prevValid){ status = "invalid"; brokenFrom = i; }
      results.push({ index: block.index, hashValid, prevValid, status });
      block.verified = status === "ok";
      block.chainStatus = status;
    }
    return { results, valid: brokenFrom === null, brokenFrom };
  }

  reset(){ this.chain = []; this.txCounter = 78200; }
}

const bc = new Blockchain();

/* ---- Ambient particle field ---- */
function makeGlowTexture(colorHex){
  const size = 128;
  const c = document.createElement("canvas"); c.width = c.height = size;
  const ctx = c.getContext("2d");
  const grad = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grad.addColorStop(0, colorHex + "ff");
  grad.addColorStop(0.35, colorHex + "aa");
  grad.addColorStop(1, colorHex + "00");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const glowTexCyan = makeGlowTexture("#3ee6ff");
const glowTexPurple = makeGlowTexture("#9b6bff");
const glowTexGreen = makeGlowTexture("#3ee69a");
const glowTexAmber = makeGlowTexture("#ffb547");
const glowTexRed = makeGlowTexture("#ff5470");
function glowTexFor(hex){
  return hex===COLORS.green?glowTexGreen: hex===COLORS.amber?glowTexAmber: hex===COLORS.red?glowTexRed: hex===COLORS.purple?glowTexPurple: glowTexCyan;
}

const PARTICLE_COUNT = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PARTICLE_COUNT*3);
const pSpeed = new Float32Array(PARTICLE_COUNT);
for(let i=0;i<PARTICLE_COUNT;i++){

const BLOCK_GAP = 6.2;
const blockGroup = new THREE.Group();

const connectionGroup = new THREE.Group();

const blockMeshes = [];      // { group, cube, edges, glow, block, ring, labelSprite }
const connectionMeshes = [];  // { curve, line, particles, colorHex }
const supplierMeshes = [];    // { group, mesh, supplier, line }

function chainPosition(i){
  // gentle S-curve path
  const x = i * BLOCK_GAP;
  const z = Math.sin(i*0.7) * 1.4;
  const y = Math.cos(i*0.5) * 0.25;
  return new THREE.Vector3(x, y, z);
}

function statusColor(block){
  if(block.chainStatus === "tampered") return COLORS.amber;
  if(block.chainStatus === "invalid") return COLORS.red;
  return COLORS.green;
}
function statusColorHex(block){
  if(block.chainStatus === "tampered") return "#ffb547";
  if(block.chainStatus === "invalid") return "#ff5470";
  return "#3ee69a";
}

function makeLabelSprite(text, opts){
  opts = opts || {};
  const w = opts.w || 256, h = opts.h || 96;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,w,h);
  ctx.font = (opts.weight||600)+" "+(opts.size||34)+"px 'Space Grotesk', sans-serif";
  ctx.fillStyle = opts.color || "#e7edf7";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = opts.glow || "rgba(62,230,255,0.8)";
  ctx.shadowBlur = 14;
  ctx.fillText(text, w/2, h/2);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set((opts.scaleW||2.6), (opts.scaleW||2.6)*(h/w), 1);
  return sprite;
}

function buildBlockMesh(block){
  const group = new THREE.Group();
  const pos = chainPosition(block.index-1);
  group.position.copy(pos);

  const size = 1.7;
  const geo = new THREE.BoxGeometry(size, size, size);
  const color = statusColor(block);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x0a1526, metalness:0.35, roughness:0.25,
    transmission:0.25, thickness:1.2, transparent:true, opacity:0.82,
    emissive: color, emissiveIntensity:0.28,
    clearcoat:0.6, clearcoatRoughness:0.3
  });
  const cube = new THREE.Mesh(geo, mat);
  group.add(cube);

  const edgesGeo = new THREE.EdgesGeometry(geo);
  const edgesMat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.95 });
  const edges = new THREE.LineSegments(edgesGeo, edgesMat);
  group.add(edges);

  // glow sprite behind
  const glowMat = new THREE.SpriteMaterial({ map:glowTexFor(color), color, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(5.2,5.2,1);
  glow.position.z = -0.2;
  group.add(glow);

  // ring at base
  const ringGeo = new THREE.RingGeometry(1.25, 1.4, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5, side:THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = -size/2 - 0.02;
  group.add(ring);

  // labels
  const numSprite = makeLabelSprite("#"+String(block.index).padStart(3,"0"), { size:40, scaleW:2.1, color:"#ffffff", glow: "#"+color.toString(16).padStart(6,"0") });
  numSprite.position.set(0, size/2 + 0.85, 0);
  group.add(numSprite);

  const idSprite = makeLabelSprite(block.supplierId, { size:26, weight:500, scaleW:1.9, color:"#9fb2cf" });
  idSprite.position.set(0, -size/2 - 0.55, 0);
  group.add(idSprite);

  blockGroup.add(group);
  const entry = { group, cube, edges, glow, ring, block, numSprite };
  blockMeshes.push(entry);
  return entry;
}

function refreshBlockVisual(entry){
  const color = statusColor(entry.block);
  entry.cube.material.emissive.setHex(color);
  entry.edges.material.color.setHex(color);
  entry.glow.material.color.setHex(color);
  entry.glow.material.map = glowTexFor(color);
  entry.ring.material.color.setHex(color);
}

/* ---- connections between blocks ---- */
function buildConnection(fromEntry, toEntry){
  const from = fromEntry.group.position;
  const to = toEntry.group.position;
  const mid = from.clone().lerp(to, 0.5).add(new THREE.Vector3(0, 1.1, 0));
  const curve = new THREE.CatmullRomCurve3([from.clone(), mid, to.clone()]);

  const tubeGeo = new THREE.TubeGeometry(curve, 32, 0.045, 8, false);
  const tubeMat = new THREE.MeshBasicMaterial({ color:COLORS.cyan, transparent:true, opacity:0.35 });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  connectionGroup.add(tube);

  // traveling particles along curve
  const PN = 5;
  const partGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(PN*3);
  partGeo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  const partMat = new THREE.PointsMaterial({ size:0.28, map:glowTexCyan, color:COLORS.cyan, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false });
  const points = new THREE.Points(partGeo, partMat);
  connectionGroup.add(points);

  const conn = { curve, tube, points, offsets:[...Array(PN)].map((_,i)=>i/PN), colorHex:COLORS.cyan };
  connectionMeshes.push(conn);
  return conn;
}

function refreshConnectionVisual(conn, colorHex){
  conn.colorHex = colorHex;
  conn.tube.material.color.setHex(colorHex);
  conn.points.material.color.setHex(colorHex);
  conn.points.material.map = glowTexFor(colorHex);
}

/* ---- suppliers in 3D (network view) ---- */
function buildSupplierMesh(supplier, idx){
  const group = new THREE.Group();
  const angle = (idx / SUPPLIERS.length) * Math.PI * 2;
  const radius = 3.6;
  const anchorX = -3.5;
  group.position.set(anchorX + Math.cos(angle)*radius*0.5, 2.6 + Math.sin(idx*1.7)*0.6, Math.sin(angle)*radius);

  const geo = new THREE.IcosahedronGeometry(0.34, 0);
  const color = supplier.status==="HIGH"?COLORS.red: supplier.status==="MEDIUM"?COLORS.amber:COLORS.green;
  const mat = new THREE.MeshStandardMaterial({ color:0x0d1a2c, emissive:color, emissiveIntensity:0.7, roughness:0.35, metalness:0.4 });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  const glowMat = new THREE.SpriteMaterial({ map:glowTexFor(color), color, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(1.6,1.6,1);
  group.add(glow);

  const label = makeLabelSprite(supplier.id, { size:24, weight:500, scaleW:1.5, color:"#cfe4ff" });
  label.position.set(0, 0.55, 0);
  group.add(label);

  supplierGroup.add(group);
  const entry = { group, mesh, supplier, glow, targetBlockEntry:null, line:null };
  supplierMeshes.push(entry);
  return entry;
}

function linkSupplierToBlock(supplierEntry, blockEntry){
  if(supplierEntry.line){ connectionGroup.remove(supplierEntry.line); }
  const from = supplierEntry.group.position;
  const to = blockEntry.group.position;
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineDashedMaterial({ color:0x4a6fa0, transparent:true, opacity:0.35, dashSize:0.3, gapSize:0.2 });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  connectionGroup.add(line);
  supplierEntry.line = line;
  supplierEntry.targetBlockEntry = blockEntry;
}

/* ============================================================
   5. BUILD INITIAL CHAIN
   ============================================================ */
let selectedBlockIndex = null;
let selectedSupplierId = null;

async function initChain(){
  for(let i=0;i<4;i++){
    const supplier = SUPPLIERS[i];
    const block = await bc.addBlock(supplier);
  }
  await bc.verify();
  bc.chain.forEach(b=>{ b.chainStatus = "ok"; });

  bc.chain.forEach(block=>{ buildBlockMesh(block); });
  for(let i=1;i<blockMeshes.length;i++){
    buildConnection(blockMeshes[i-1], blockMeshes[i]);
  }
  SUPPLIERS.forEach((s, idx)=>{
    const se = buildSupplierMesh(s, idx);
    const be = blockMeshes.find(b=>b.block.supplierId===s.id);
    if(be) linkSupplierToBlock(se, be);
  });

  updateStats();
}

/* ============================================================
   6. CREATE BLOCK (with hash-flow animation)
   ============================================================ */
let creatingBlock = false;
async function createBlock(){
  if(creatingBlock) return;
  creatingBlock = true;
  document.getElementById("btn-create").disabled = true;

  const supplier = choice(SUPPLIERS);
  // slight risk drift each transaction for realism
  supplier.risk = clamp(supplier.risk + Math.round(rand(-4,4)), 3, 96);
  supplier.status = riskStatus(supplier.risk);

  toast(`Transaction created — ${supplier.id} → ${supplier.component}`, "info");
  await sleep(350);

  const prevEntry = blockMeshes[blockMeshes.length-1];
  const block = await bc.addBlock(supplier);
  block.chainStatus = "ok";

  // hash-flow particle burst from previous block to new block position
  if(prevEntry){
    await animateHashFlow(prevEntry.group.position.clone(), chainPosition(block.index-1));
  }

  const entry = buildBlockMesh(block);
  entry.group.scale.set(0.01,0.01,0.01);
  animateScaleIn(entry.group);

  if(prevEntry){
    const conn = buildConnection(prevEntry, entry);
  }

  // link to its supplier
  let se = supplierMeshes.find(s=>s.supplier.id===supplier.id);
  if(se) linkSupplierToBlock(se, entry);

  focusCameraOn(entry.group.position, 12);
  toast(`Block #${String(block.index).padStart(3,"0")} created and linked — VERIFIED`, "ok");
  updateStats();
  refreshSidePanelIfNeeded();

  creatingBlock = false;
  document.getElementById("btn-create").disabled = false;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function animateScaleIn(group){
  const start = performance.now();
  const dur = 650;
  function step(t){
    const p = clamp((t-start)/dur, 0, 1);
    const eased = 1 - Math.pow(1-p, 3);
    group.scale.set(eased, eased, eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function animateHashFlow(fromPos, toPos){
  return new Promise(resolve=>{
    const n = 24;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(n*3);
    for(let i=0;i<n;i++){ positions[i*3]=fromPos.x; positions[i*3+1]=fromPos.y; positions[i*3+2]=fromPos.z; }
    geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({ size:0.22, map:glowTexCyan, color:COLORS.purple, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false });
    const points = new THREE.Points(geo, mat);
    scene.add(points);
    const start = performance.now();
    const dur = 700;
    function step(t){
      const p = clamp((t-start)/dur, 0, 1);
      const arr = geo.attributes.position.array;
      for(let i=0;i<n;i++){
        const delay = i/n*0.35;
        const lp = clamp((p-delay)/(1-delay), 0, 1);
        const eased = lp*lp*(3-2*lp);
        arr[i*3] = fromPos.x + (toPos.x-fromPos.x)*eased;
        arr[i*3+1] = fromPos.y + (toPos.y-fromPos.y)*eased + Math.sin(eased*Math.PI)*0.9;
        arr[i*3+2] = fromPos.z + (toPos.z-fromPos.z)*eased;
      }
      geo.attributes.position.needsUpdate = true;
      mat.opacity = 0.95 * (1-p*0.15);
      if(p<1){ requestAnimationFrame(step); }
      else { scene.remove(points); geo.dispose(); mat.dispose(); resolve(); }
    }
    requestAnimationFrame(step);
  });
}

/* ============================================================
   7. VERIFY BLOCKCHAIN
   ============================================================ */
let verifying = false;
async function runVerification(){
  if(verifying) return;
  verifying = true;
  setMode("verify");
  const body = document.getElementById("side-body");
  body.innerHTML = `<div id="verify-log"></div>`;
  const log = document.getElementById("verify-log");

  const rows = [];
  for(const entry of blockMeshes){
    const row = document.createElement("div");
    row.className = "verify-row pending";
    row.innerHTML = `<span class="ico">…</span><span>Checking Block #${String(entry.block.index).padStart(3,"0")}</span>`;
    log.appendChild(row);
    rows.push(row);

    // scanning highlight
    flashScan(entry);
    await sleep(260);
  }

  const result = await bc.verify();

  for(let i=0;i<blockMeshes.length;i++){
    const entry = blockMeshes[i];
    const r = result.results[i];
    const ok = r.status === "ok";
    rows[i].className = "verify-row " + (ok ? "ok":"bad");
    rows[i].innerHTML = `<span class="ico">${ok?"✓":"✕"}</span><span>Block #${String(entry.block.index).padStart(3,"0")} — ${ok?"VALID":(r.status==="tampered"?"HASH MISMATCH":"CHAIN BROKEN")}</span>`;
    refreshBlockVisual(entry);
    if(i>0) refreshConnectionVisual(connectionMeshes[i-1], statusColor(entry.block));
    await sleep(90);
  }

  const summaryWrap = document.createElement("div");
  summaryWrap.style.marginTop = "12px";
  if(result.valid){
    summaryWrap.innerHTML = `
      <div class="verify-row ok"><span class="ico">✓</span><span>Hash Valid</span></div>
      <div class="verify-row ok"><span class="ico">✓</span><span>Previous Hash Valid</span></div>
      <div class="verify-row ok"><span class="ico">✓</span><span>Transaction Valid</span></div>
      <div class="verify-row ok"><span class="ico">✓</span><span>Chain Integrity Valid</span></div>
      <div class="verify-final ok">BLOCKCHAIN INTEGRITY VERIFIED</div>`;
    toast("Blockchain integrity verified across all blocks", "ok");
  } else {
    summaryWrap.innerHTML = `
      <div class="verify-row bad"><span class="ico">✕</span><span>Hash Mismatch Detected</span></div>
      <div class="verify-row bad"><span class="ico">✕</span><span>Chain Integrity Broken</span></div>
      <div class="verify-final bad">CHAIN INTEGRITY COMPROMISED</div>`;
    toast("Chain integrity compromised — tampering detected", "bad");
  }
  log.appendChild(summaryWrap);

  updateStats();
  verifying = false;
  document.getElementById("btn-restore").disabled = !bc.chain.some(b=>b.tampered);
}

function flashScan(entry){
  const orig = entry.cube.material.emissiveIntensity;
  entry.cube.material.emissiveIntensity = 1.1;
  entry.ring.scale.set(1.4,1.4,1.4);
  setTimeout(()=>{ entry.cube.material.emissiveIntensity = orig; entry.ring.scale.set(1,1,1); }, 220);
}

/* ============================================================
   8. TAMPER + RESTORE
   ============================================================ */
async function simulateTampering(){
  setMode("tamper");
  const candidates = blockMeshes.filter(e=>!e.block.tampered);
  if(candidates.length === 0){ toast("No untampered blocks available", "warn"); return; }
  const target = candidates[Math.floor(candidates.length/2)] || candidates[0];
  const block = target.block;
  const original = JSON.parse(JSON.stringify(block.data));
  const bumped = clamp(original.riskScore + 40, 0, 99);
  const newStatus = riskStatus(bumped);

  await bc.tamperBlock(block.index, { riskScore: bumped, status: newStatus });

  const body = document.getElementById("side-body");
  body.innerHTML = `
    <div class="field-row">
      <div class="field-label">Target Block</div>
      <div class="field-value">Block #${String(block.index).padStart(3,"0")} — ${block.supplierId}</div>
    </div>
    <div class="divider-line"></div>
    <div class="field-row">
      <div class="field-label">Original</div>
      <div class="field-value">Risk Score ${original.riskScore} · <span class="risk-tag ${original.status}">${original.status}</span></div>
    </div>
    <div class="field-row">
      <div class="field-label">Modified</div>
      <div class="field-value">Risk Score ${bumped} · <span class="risk-tag ${newStatus}">${newStatus}</span></div>
    </div>
    <div class="divider-line"></div>
    <div class="status-pill tampered">⚠ DATA MODIFIED</div>
    <div class="field-value" style="color:var(--text-dim);font-size:12.5px;line-height:1.6;">
      Stored data no longer matches the hash recorded on Block #${String(block.index).padStart(3,"0")}.
      Run verification to detect the mismatch and see how it invalidates the downstream chain.
    </div>`;

  // visual pulse on the block
  pulseWarning(target);
  focusCameraOn(target.group.position, 10);
  toast(`Block #${String(block.index).padStart(3,"0")} data modified — hash mismatch pending verification`, "warn");

  // auto-run verification shortly after to show cascade
  await sleep(900);
  await runVerification();
  document.getElementById("btn-restore").disabled = false;
}

function pulseWarning(entry){
  let t0 = performance.now();
  const dur = 1400;
  function step(t){
    const p = ((t-t0)/dur) % 1;
    const s = 1 + Math.sin(p*Math.PI*2)*0.06;
    entry.group.scale.set(s,s,s);
    if(performance.now()-t0 < 3000) requestAnimationFrame(step);
    else entry.group.scale.set(1,1,1);
  }
  requestAnimationFrame(step);
}

async function restoreData(){
  const tamperedBlock = bc.chain.find(b=>b.tampered);
  if(!tamperedBlock){ toast("No tampered blocks to restore", "info"); return; }
  bc.restoreBlock(tamperedBlock.index);
  toast(`Block #${String(tamperedBlock.index).padStart(3,"0")} restored to original data`, "info");
  await runVerification();
  toast("Blockchain integrity restored", "ok");
  document.getElementById("btn-restore").disabled = true;
}

/* ============================================================
   9. RESET
   ============================================================ */
async function resetBlockchain(){
  // dispose meshes
  blockMeshes.forEach(e=>{
    e.cube.geometry.dispose(); e.cube.material.dispose();
    e.edges.geometry.dispose(); e.edges.material.dispose();
    e.glow.material.dispose(); e.ring.geometry.dispose(); e.ring.material.dispose();
    blockGroup.remove(e.group);
  });
  connectionMeshes.forEach(c=>{
    c.tube.geometry.dispose(); c.tube.material.dispose();
    c.points.geometry.dispose(); c.points.material.dispose();
    connectionGroup.remove(c.tube); connectionGroup.remove(c.points);
  });
  supplierMeshes.forEach(s=>{ if(s.line){ connectionGroup.remove(s.line);} supplierGroup.remove(s.group); });
  blockMeshes.length = 0; connectionMeshes.length = 0; supplierMeshes.length = 0;
  bc.reset();
  selectedBlockIndex = null;
  closeDetailPanel();
  await initChain();
  toast("Blockchain reset — genesis chain reinitialized", "info");
  document.getElementById("btn-restore").disabled = true;
}

/* ============================================================
   10. INTERACTION — hover / click / detail panel
   ============================================================ */
const tooltipEl = document.getElementById("block-tooltip");
let hoveredEntry = null;

function onPointerMove(e){
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX-rect.left)/rect.width)*2-1;
  pointerNDC.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointerNDC, camera);
  const cubes = blockMeshes.map(b=>b.cube);
  const hits = raycaster.intersectObjects(cubes);

  if(hits.length){
    const entry = blockMeshes.find(b=>b.cube === hits[0].object);
    if(entry !== hoveredEntry){
      if(hoveredEntry) hoveredEntry.cube.material.emissiveIntensity = 0.28;
      hoveredEntry = entry;
      entry.cube.material.emissiveIntensity = 0.6;
    }
    tooltipEl.classList.add("show");
    tooltipEl.style.left = e.clientX + "px";
    tooltipEl.style.top = e.clientY + "px";
    const color = statusColorHex(entry.block);
    tooltipEl.style.borderColor = color+"55";
    tooltipEl.innerHTML = `<b style="color:${color}">BLOCK #${String(entry.block.index).padStart(3,"0")}</b> · ${entry.block.supplierId} · ${shortHash(entry.block.hash)}`;
    canvas.style.cursor = "pointer";
  } else {
    if(hoveredEntry){ hoveredEntry.cube.material.emissiveIntensity = 0.28; hoveredEntry = null; }
    tooltipEl.classList.remove("show");
    canvas.style.cursor = "grab";
  }
}
canvas.addEventListener("pointermove", onPointerMove);

function onClick(e){
  if(hoveredEntry){
    openDetailPanel(hoveredEntry.block);
    focusCameraOn(hoveredEntry.group.position, 9);
    return;
  }
  // check supplier nodes
  raycaster.setFromCamera(pointerNDC, camera);
  const meshes = supplierMeshes.map(s=>s.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if(hits.length){
    const se = supplierMeshes.find(s=>s.mesh===hits[0].object);
    selectSupplier(se.supplier.id);
  }
}
canvas.addEventListener("click", onClick);

function openDetailPanel(block){

function closeDetailPanel(){
  document.getElementById("detail-panel").classList.remove("open");
  selectedBlockIndex = null;

document.getElementById("detail-close").addEventListener("click", closeDetailPanel);

function focusCameraOn(pos, distance){
  const targetPos = pos.clone();
  const camOffset = new THREE.Vector3(2.5, 3.2, distance||10);
  const camTarget = targetPos.clone().add(camOffset);
  animateCamera(camTarget, targetPos, 900);
}

function animateCamera(camPos, lookAt, dur){
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const t0 = performance.now();
  controls.enabled = false;
  function step(t){
    const p = clamp((t-t0)/dur, 0, 1);
    const eased = 1 - Math.pow(1-p, 3);
    camera.position.lerpVectors(startPos, camPos, eased);
    controls.target.lerpVectors(startTarget, lookAt, eased);
    controls.update();
    if(p<1) requestAnimationFrame(step);
    else controls.enabled = true;
  }
  requestAnimationFrame(step);
}

/* ============================================================
   11. NAV / SIDE PANEL MODES
   ============================================================ */
let currentMode = "network";
function setMode(mode){
  currentMode = mode;
  document.querySelectorAll(".nav-btn[data-mode]").forEach(b=>b.classList.toggle("active", b.dataset.mode===mode));
  const sidePanel = document.getElementById("side-panel");
  const title = document.getElementById("side-title");
  const body = document.getElementById("side-body");

  if(mode === "network"){
    sidePanel.classList.remove("open");
    return;
  }
  sidePanel.classList.add("open");

  if(mode === "suppliers"){
    title.textContent = "Supplier Records";
    body.innerHTML = "";
    SUPPLIERS.forEach(s=>{
      const card = document.createElement("div");
      card.className = "supplier-card" + (s.id===selectedSupplierId?" selected":"");
      card.innerHTML = `
        <div class="supplier-top"><span class="supplier-id">${s.id}</span><span class="risk-tag ${s.status}">${s.status}</span></div>
        <div class="supplier-name">${s.name}</div>
        <div class="supplier-meta">${s.component} · Tier ${s.tier} · Risk ${s.risk}</div>`;
      card.addEventListener("click", ()=>selectSupplier(s.id));
      body.appendChild(card);
    });
  }
  else if(mode === "chain"){
    title.textContent = "Supply Chain Tiers";
    renderTierTree(body);
  }
  else if(mode === "verify"){
    title.textContent = "Chain Verification";
    body.innerHTML = `<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px;">Run verification to check hash continuity across the chain.</div>`;
  }
  else if(mode === "tamper"){
    title.textContent = "Tampering Simulation";
    if(!bc.chain.some(b=>b.tampered)){
      body.innerHTML = `<div style="font-size:12.5px;color:var(--text-dim);line-height:1.6;">Use "Simulate Tampering" to modify a block's stored data without updating its hash — then verify the chain to see how the mismatch is detected and propagates.</div>`;
    }
  }
}
function refreshSidePanelIfNeeded(){
  if(currentMode==="suppliers" || currentMode==="chain") setMode(currentMode);
}

function renderTierTree(container){
  const tiers = [1,2,3];
  let html = `<div style="text-align:center;padding:10px 0 16px;">
    <div style="display:inline-block;padding:10px 18px;border-radius:10px;background:rgba(62,230,255,0.08);border:1px solid rgba(62,230,255,0.3);font-family:var(--font-display);font-weight:600;font-size:13px;">LinkGuard Organization</div>
  </div>`;
  tiers.forEach(tier=>{
    const items = SUPPLIERS.filter(s=>s.tier===tier);
    html += `<div style="margin-bottom:14px;">
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;text-align:center;">Tier ${tier}</div>`;
    items.forEach(s=>{
      const block = bc.chain.find(b=>b.supplierId===s.id);
      const bstatus = block ? (block.chainStatus||"ok") : null;
      const dot = bstatus==="tampered"?"var(--amber)":bstatus==="invalid"?"var(--red)":block?"var(--green)":"var(--text-faint)";
      html += `<div class="supplier-card" style="margin-left:${(tier-1)*14}px;cursor:pointer;" data-sid="${s.id}">
        <div class="supplier-top"><span class="supplier-id">${s.id}</span><span style="width:8px;height:8px;border-radius:50%;background:${dot};box-shadow:0 0 6px ${dot};"></span></div>
        <div class="supplier-name">${s.name}</div>
        <div class="supplier-meta">${s.component}${block?` · Block #${String(block.index).padStart(3,'0')}`:" · No block yet"}</div>
      </div>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll("[data-sid]").forEach(el=>{
    el.addEventListener("click", ()=>selectSupplier(el.dataset.sid));
  });
}

function selectSupplier(id){
  selectedSupplierId = id;
  const se = supplierMeshes.find(s=>s.supplier.id===id);
  if(se){
    focusCameraOn(se.group.position, 7);
    if(se.targetBlockEntry) openDetailPanel(se.targetBlockEntry.block);
    pulseWarning({ group:se.group });
  }
  if(currentMode==="suppliers" || currentMode==="chain") setMode(currentMode);
}

document.querySelectorAll(".nav-btn[data-mode]").forEach(btn=>{
  btn.addEventListener("click", ()=>setMode(btn.dataset.mode));
});

/* ============================================================
   12. STATS
   ============================================================ */
function updateStats(){
  const total = bc.chain.length;
  const verified = bc.chain.filter(b=>b.chainStatus!=="tampered" && b.chainStatus!=="invalid").length;
  const txCount = bc.chain.length;
  const uniqueSuppliersOnChain = new Set(bc.chain.map(b=>b.supplierId)).size;

  document.getElementById("stat-blocks").textContent = total;
  document.getElementById("stat-verified").textContent = verified;
  document.getElementById("stat-tx").textContent = txCount;
  document.getElementById("stat-suppliers").innerHTML = `${uniqueSuppliersOnChain}<span class="unit">/${SUPPLIERS.length}</span>`;
  const statusEl = document.getElementById("stat-status");
  const allValid = verified === total;
  statusEl.textContent = allValid ? "VALID" : "COMPROMISED";
  statusEl.className = "stat-value " + (allValid ? "green" : "red");
  const last = bc.chain[bc.chain.length-1];
  document.getElementById("stat-last").textContent = last ? last.timestamp : "—";
}

document.getElementById("btn-verify").addEventListener("click", runVerification);

/* ============================================================
   14. PRESENTATION MODE
   ============================================================ */
let presenting = false;
async function runPresentation(){
  if(presenting) return;
  presenting = true;
  document.getElementById("present-exit").classList.add("show");
  document.getElementById("present-vignette").classList.add("show");
  document.getElementById("nav").style.opacity = "0.15";
  document.getElementById("stats-bar").style.opacity = "0.5";
  document.getElementById("side-panel").classList.remove("open");
  document.getElementById("detail-panel").classList.remove("open");

  const steps = [
    { label:"01 · Supplier Transaction", text:"A verified supplier transaction is captured from the LinkGuard supply chain.", cam:()=>focusCameraOn(supplierMeshes[0].group.position, 6), wait:4200 },
    { label:"02 · Block Creation", text:"The transaction is packaged into a new block awaiting a cryptographic signature.", cam:()=>focusCameraOn(blockMeshes[blockMeshes.length-1].group.position, 11), wait:4200 },
    { label:"03 · Hash Generation", text:"A SHA-256 hash is generated from the block's contents using the Web Crypto API.", cam:()=>{}, wait:3600 },
    { label:"04 · Chain Linking", text:"The new block references the previous block's hash — permanently linking the two.", cam:()=>fitCameraToChain(), wait:4200 },
    { label:"05 · Verification", text:"Every block is scanned end-to-end to confirm hash continuity across the chain.", cam:()=>fitCameraToChain(), wait:4600 },
    { label:"06 · Tamper Detection", text:"Modifying stored data breaks its hash match — LinkGuard flags the block and everything after it as invalid.", cam:()=>{}, wait:5200 },
  ];

  const capEl = document.getElementById("present-caption");
  const labelEl = document.getElementById("present-step-label");
  const textEl = document.getElementById("present-step-text");

  for(let i=0;i<steps.length && presenting;i++){
    const s = steps[i];
    labelEl.textContent = s.label; textEl.textContent = s.text;
    capEl.classList.add("show");
    s.cam();
    if(i===1){ await sleep(1200); if(presenting) await createBlock(); }
    if(i===4){ await sleep(1000); if(presenting) await runVerification(); }
    if(i===5){ await sleep(1000); if(presenting) await simulateTampering(); }
    await sleep(s.wait);
    if(!presenting) break;
  }

  if(presenting){
    await sleep(600);
    if(bc.chain.some(b=>b.tampered)){ await restoreData(); }
    labelEl.textContent = "Complete";
    textEl.textContent = "Every supplier transaction is recorded, linked, and verifiable — with tampering instantly detectable.";
    await sleep(2600);
  }
  exitPresentation();
}
function exitPresentation(){
  presenting = false;
  document.getElementById("present-exit").classList.remove("show");
  document.getElementById("present-vignette").classList.remove("show");
  document.getElementById("present-caption").classList.remove("show");
  document.getElementById("nav").style.opacity = "1";
  document.getElementById("stats-bar").style.opacity = "1";
  fitCameraToChain();
}
function fitCameraToChain(){
  if(!blockMeshes.length) return;
  const midIdx = Math.floor(blockMeshes.length/2);
  const mid = blockMeshes[midIdx].group.position;
  const span = blockMeshes.length * BLOCK_GAP;
  animateCamera(new THREE.Vector3(mid.x, 7.5, span*0.55+6), new THREE.Vector3(mid.x*0.6, 0.5, 0), 1400);
}
document.getElementById("btn-present").addEventListener("click", runPresentation);
document.getElementById("present-exit").addEventListener("click", exitPresentation);

/* ============================================================
   15. CLOCK
   ============================================================ */
function tickClock(){ document.getElementById("clock").textContent = nowStamp() + " UTC+5:30"; }
setInterval(tickClock, 1000); tickClock();

/* ============================================================
   16. ANIMATION LOOP
   ============================================================ */
let clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // particle drift
  const arr = pGeo.attributes.position.array;
  for(let i=0;i<PARTICLE_COUNT;i++){
    arr[i*3+1] += pSpeed[i]*dt*0.6;
    if(arr[i*3+1] > 26) arr[i*3+1] = -3;
  }
  pGeo.attributes.position.needsUpdate = true;

  // block float + rotation
  blockMeshes.forEach((e,i)=>{
    e.group.position.y = chainPosition(i).y + Math.sin(t*0.6 + i)*0.08;
    e.cube.rotation.y += dt*0.12;
    e.edges.rotation.y = e.cube.rotation.y;
    e.ring.rotation.z += dt*0.15;
    e.numSprite.quaternion.copy(camera.quaternion);
  });

  // supplier float + billboarding
  supplierMeshes.forEach((s,i)=>{
    s.mesh.rotation.y += dt*0.4;
    s.mesh.rotation.x += dt*0.25;
    s.group.position.y += Math.sin(t*0.8+i)*0.0015;
  });

  // connection particle flow
  connectionMeshes.forEach(conn=>{
    const posAttr = conn.points.geometry.attributes.position;
    for(let i=0;i<conn.offsets.length;i++){
      conn.offsets[i] += dt*0.22;
      if(conn.offsets[i] > 1) conn.offsets[i] -= 1;
      const pt = conn.curve.getPointAt(conn.offsets[i]);
      posAttr.array[i*3] = pt.x; posAttr.array[i*3+1] = pt.y; posAttr.array[i*3+2] = pt.z;
    }
    posAttr.needsUpdate = true;
  });

  // supplier link line particles skip (dashed static ok)

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   17. BOOTSTRAP
   ============================================================ */
initChain().then(()=>{
  setTimeout(()=>{ document.getElementById("loader").classList.add("hide"); }, 350);
  animate();
});

})();
